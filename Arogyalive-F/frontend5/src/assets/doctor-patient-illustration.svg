<svg viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="al-illustration-title">
  <title id="al-illustration-title">Doctor consulting with a patient</title>

  <!-- soft background blobs -->
  <circle cx="90" cy="90" r="120" fill="#0fa878" opacity="0.10" />
  <circle cx="520" cy="380" r="150" fill="#0a7ea3" opacity="0.10" />
  <circle cx="500" cy="70" r="70" fill="#ff8a5b" opacity="0.12" />

  <!-- ground -->
  <ellipse cx="300" cy="440" rx="230" ry="20" fill="#0a7ea3" opacity="0.06" />

  <!-- floating medical cross badge -->
  <g transform="translate(470,60)">
    <circle r="34" fill="#ffffff" stroke="#e3f0f3" stroke-width="2" />
    <rect x="-5" y="-16" width="10" height="32" rx="3" fill="#0fa878" />
    <rect x="-16" y="-5" width="32" height="10" rx="3" fill="#0fa878" />
  </g>

  <!-- heartbeat pulse line -->
  <path d="M40 260 h40 l12 -30 l18 55 l14 -70 l16 45 l10 -20 h50"
        fill="none" stroke="#0a7ea3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />

  <!-- ===== Patient (seated, left) ===== -->
  <g transform="translate(150,180)">
    <!-- chair -->
    <rect x="-60" y="140" width="150" height="14" rx="7" fill="#dfeaec" />
    <rect x="-46" y="60" width="14" height="94" rx="6" fill="#dfeaec" />
    <rect x="70" y="60" width="14" height="94" rx="6" fill="#dfeaec" />

    <!-- body -->
    <path d="M-25 90 q35 -30 90 0 l10 70 q-55 20 -110 0 z" fill="#ff8a5b" />
    <!-- arm resting -->
    <path d="M-22 100 q-25 15 -20 45 q3 12 18 10 l6 -18 q-8 -4 -6 -16 q10 -10 18 -14 z" fill="#ffb26b" />
    <!-- neck -->
    <rect x="24" y="48" width="18" height="18" rx="6" fill="#f2b789" />
    <!-- head -->
    <circle cx="33" cy="35" r="26" fill="#f7c9a0" />
    <!-- hair -->
    <path d="M8 30 q0 -30 28 -30 q26 0 26 26 q-10 -14 -26 -12 q-18 2 -20 18 q-4 -1 -8 -2 z" fill="#3a2a20" />
    <!-- smile -->
    <path d="M22 42 q10 8 20 0" fill="none" stroke="#7a4a30" stroke-width="2.4" stroke-linecap="round" />
    <circle cx="20" cy="32" r="2.4" fill="#3a2a20" />
    <circle cx="42" cy="32" r="2.4" fill="#3a2a20" />
  </g>

  <!-- ===== Doctor (standing, right) ===== -->
  <g transform="translate(330,90)">
    <!-- legs -->
    <rect x="-6" y="210" width="22" height="70" rx="8" fill="#123544" />
    <rect x="40" y="210" width="22" height="70" rx="8" fill="#123544" />
    <rect x="-10" y="272" width="30" height="12" rx="6" fill="#0d2b33" />
    <rect x="36" y="272" width="30" height="12" rx="6" fill="#0d2b33" />

    <!-- coat body -->
    <path d="M-30 90 q60 -34 130 0 l16 130 q-80 26 -162 0 z" fill="#ffffff" stroke="#dfeaec" stroke-width="2" />
    <!-- coat inner shirt -->
    <path d="M18 88 l16 26 l16 -26 q6 40 4 96 q-20 8 -40 0 q-2 -56 4 -96 z" fill="#0a7ea3" opacity="0.85" />
    <!-- coat lapels -->
    <path d="M-30 90 q10 40 8 96 l24 -10 q-4 -50 -12 -92 z" fill="#eef7f6" />
    <path d="M100 90 q-10 40 -8 96 l-24 -10 q4 -50 12 -92 z" fill="#eef7f6" />

    <!-- arm holding clipboard -->
    <path d="M96 100 q30 10 34 46 q2 16 -14 18 l-10 -14 q8 -4 6 -14 q-4 -18 -22 -22 z" fill="#ffffff" stroke="#dfeaec" stroke-width="2" />
    <!-- clipboard -->
    <g transform="translate(96,150) rotate(8)">
      <rect x="0" y="0" width="30" height="38" rx="4" fill="#0fa878" />
      <rect x="4" y="4" width="22" height="30" rx="2" fill="#ffffff" />
      <rect x="7" y="9" width="16" height="3" rx="1.5" fill="#dfeaec" />
      <rect x="7" y="15" width="16" height="3" rx="1.5" fill="#dfeaec" />
      <rect x="7" y="21" width="10" height="3" rx="1.5" fill="#dfeaec" />
    </g>

    <!-- other arm relaxed -->
    <path d="M-24 100 q-22 14 -18 46 q2 14 14 14 l8 -14 q-6 -2 -6 -12 q0 -16 14 -22 z" fill="#ffffff" stroke="#dfeaec" stroke-width="2" />

    <!-- stethoscope -->
    <path d="M22 70 q0 24 14 24 q14 0 14 -22" fill="none" stroke="#0d2b33" stroke-width="4" stroke-linecap="round" />
    <circle cx="22" cy="70" r="4" fill="#0d2b33" />
    <circle cx="50" cy="72" r="4" fill="#0d2b33" />
    <circle cx="50" cy="94" r="7" fill="#0fa878" />

    <!-- neck -->
    <rect x="24" y="46" width="18" height="18" rx="6" fill="#e8b48a" />
    <!-- head -->
    <circle cx="33" cy="32" r="26" fill="#f0bd8e" />
    <!-- hair -->
    <path d="M8 26 q2 -28 26 -28 q28 0 28 26 q-6 -10 -18 -12 q4 8 0 14 q-6 -12 -20 -12 q-12 0 -16 12 z" fill="#1c1c1c" />
    <!-- glasses -->
    <circle cx="22" cy="32" r="7" fill="none" stroke="#0d2b33" stroke-width="2.2" />
    <circle cx="44" cy="32" r="7" fill="none" stroke="#0d2b33" stroke-width="2.2" />
    <line x1="29" y1="32" x2="37" y2="32" stroke="#0d2b33" stroke-width="2.2" />
    <!-- smile -->
    <path d="M23 44 q10 7 20 0" fill="none" stroke="#7a4a30" stroke-width="2.4" stroke-linecap="round" />
  </g>

  <!-- small plus decorations -->
  <g fill="#0a7ea3" opacity="0.4">
    <rect x="20" y="380" width="6" height="18" rx="2" />
    <rect x="14" y="386" width="18" height="6" rx="2" />
  </g>
  <g fill="#0fa878" opacity="0.35">
    <rect x="555" y="180" width="6" height="16" rx="2" />
    <rect x="550" y="185" width="16" height="6" rx="2" />
  </g>
</svg>
